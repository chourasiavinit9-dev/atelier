name: CI/CD — AuraPlan

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Test · Build · Size Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (zero warnings)
        run: npm run lint -- --max-warnings 0

      - name: TypeScript check
        run: npm run typecheck

      - name: Vitest unit tests
        run: npm test -- --run

      - name: Build production bundle
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'placeholder_for_build' }}

      - name: Repository size gate (< 10 MB)
        run: |
          SIZE=$(du -sm --exclude=node_modules --exclude=.next . 2>/dev/null | awk '{print $1}' || du -sm . | awk '{print $1}')
          echo "Repo size: ${SIZE}MB"
          if [ "$SIZE" -ge 10 ]; then
            echo "❌ Repository too large: ${SIZE}MB (limit: 10MB)"
            exit 1
          fi
          echo "✅ Repository size OK: ${SIZE}MB"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E + axe (mock API)
        run: npm run test:e2e
        env:
          CI: true
        continue-on-error: true  # non-blocking until E2E tests are finalized

  deploy:
    name: Deploy to Vercel (main only)
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Deploy to Vercel
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
